name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public files
        run: ./scripts/check-public-files.ps1
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Windows x64
        run: ./scripts/publish.ps1
      - name: Package clean artifacts
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Open-Net-Windows-x64-CI
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
