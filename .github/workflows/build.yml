name: Windows build
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Windows build and safe checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public files
        run: ./scripts/check-public-files.ps1
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build safe test host
        run: ./scripts/publish.ps1 -TestBuild
      - name: Run headless safe checks
        run: ./scripts/test-headless.ps1
      - name: Build direct-launch Safe Preview
        run: ./scripts/publish.ps1 -SafePreview
      - name: Verify direct preview isolation
        run: ./scripts/verify-safe-preview.ps1 -ExePath 'publish/Open Net Safe Preview/Open Net.exe'
      - name: Build Windows x64
        run: ./scripts/publish.ps1
      - name: Package clean test artifacts
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Open-Net-Windows-x64-CI
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
